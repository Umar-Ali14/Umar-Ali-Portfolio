<!doctype html>
<!--
  Source for public/og-image.png (1200×630 social preview).
  Regenerate with headless Chrome, e.g.:
    chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png design/og-card.html
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #030712; }
  body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; color: #f8fafc; position: relative; }

  /* glows + grid, as on the site */
  .glow-a { position: absolute; width: 900px; height: 600px; left: 380px; top: -300px; border-radius: 50%;
            background: hsl(212 100% 56% / .16); filter: blur(120px); }
  .glow-b { position: absolute; width: 500px; height: 400px; right: -120px; bottom: -180px; border-radius: 50%;
            background: hsl(262 83% 66% / .12); filter: blur(120px); }
  .grid { position: absolute; inset: 0; opacity: .07;
          background-image: linear-gradient(hsl(212 100% 70%) 1px, transparent 1px),
                            linear-gradient(90deg, hsl(212 100% 70%) 1px, transparent 1px);
          background-size: 64px 64px;
          -webkit-mask-image: radial-gradient(ellipse at 60% 50%, #000 35%, transparent 80%); }
  canvas { position: absolute; inset: 0; }

  .content { position: absolute; left: 80px; top: 0; bottom: 0; width: 880px;
             display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
          background: linear-gradient(135deg, #1f8fff, #8b5cf6); font-weight: 800; font-size: 27px;
          box-shadow: 0 10px 40px -10px hsl(240 90% 60% / .8); }
  .name { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }

  .badge { margin-top: 34px; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
           padding: 9px 18px; border-radius: 999px; border: 1px solid hsl(220 33% 22%);
           background: hsl(222 40% 11% / .7); color: #2f8bff; font-size: 17px; font-weight: 700;
           letter-spacing: .18em; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: #2f8bff; display: block; }

  h1 { margin-top: 26px; font-size: 56px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; }
  h1 .hl { background: linear-gradient(90deg, #7dd3fc, #60a5fa, #3b82f6);
           -webkit-background-clip: text; background-clip: text; color: transparent; }

  .stack { margin-top: 34px; display: flex; align-items: center; gap: 14px; }
  .chip { padding: 10px 20px; border-radius: 12px; border: 1px solid hsl(220 33% 22%);
          background: hsl(222 40% 11% / .75); font-size: 20px; font-weight: 600; color: #e2e8f0; }
  .sep { color: #2f8bff; font-size: 22px; font-weight: 700; }

  .url { position: absolute; left: 80px; bottom: 44px; font-size: 18px; font-weight: 600; color: #94a3b8;
         display: flex; align-items: center; gap: 10px; }
  .url b { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; display: block; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
         background: linear-gradient(90deg, #1f8fff, #8b5cf6); }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="grid"></div>
  <canvas id="net" width="1200" height="630"></canvas>

  <div class="content">
    <div class="brand"><div class="logo">UA</div><div class="name">Umar Ali</div></div>
    <div class="badge"><i></i>AWS CLOUD ENGINEER</div>
    <h1>Building <span class="hl">Secure &amp; Scalable</span><br />Cloud Infrastructure</h1>
    <div class="stack">
      <span class="chip">AWS</span><span class="sep">|</span>
      <span class="chip">Terraform</span><span class="sep">|</span>
      <span class="chip">GitHub Actions</span>
    </div>
  </div>

  <div class="url"><b></b>umar-ali-portfolio.vercel.app</div>
  <div class="bar"></div>

  <script>
    // Static "connected particles" network on the right side (deterministic so renders are repeatable).
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const ctx = document.getElementById('net').getContext('2d');
    const pts = Array.from({ length: 46 }, () => ({
      x: 640 + rand() * 580, y: 20 + rand() * 590, r: rand() < 0.22 ? 2.6 : 1.4 + rand(), glow: rand() < 0.25,
    }));
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d < 150) {
        ctx.strokeStyle = `hsla(212,100%,62%,${(1 - d / 150) * 0.35})`;
        ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
      }
    }
    for (const p of pts) {
      if (p.glow) { ctx.fillStyle = 'hsla(205,100%,65%,.18)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4.5, 0, 7); ctx.fill(); }
      ctx.fillStyle = p.glow ? 'hsla(200,100%,72%,.95)' : 'hsla(212,100%,62%,.75)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  </script>
</body>
</html>
